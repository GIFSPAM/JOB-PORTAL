services:
  db:
    image: mariadb:11
    container_name: jobportal-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: job_portal
      MARIADB_USER: jobuser
      MARIADB_PASSWORD: jobpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
    container_name: jobportal-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: jobuser
      DB_PASS: jobpassword
      DB_NAME: job_portal
      JWT_SECRET: SECRET_KEY
      ADMIN_SECRET: BLACKBERRY
      CLOUDINARY_CLOUD_NAME: dsmvie1rw
      CLOUDINARY_API_KEY: 123136656699826
      CLOUDINARY_API_SECRET: yZnClCy7bRx2yg5leBdNIPt3pTM
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: jobportal-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data: